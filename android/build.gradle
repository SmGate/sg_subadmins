import groovy.xml.XmlSlurper

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.13'
    }

    configurations.classpath {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { project ->
    buildscript {
        configurations.classpath {
            resolutionStrategy {
                eachDependency { details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name == 'kotlin-gradle-plugin') {
                        details.useVersion(kotlin_version)
                    }
                }
                force "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
            }
        }
    }
}

subprojects { project ->
    afterEvaluate {
        def isAndroidLib = project.plugins.hasPlugin('com.android.library')
        def isAndroidApp = project.plugins.hasPlugin('com.android.application')
        if (isAndroidLib || isAndroidApp) {
            try {
                if (!project.android.hasProperty('namespace') || !project.android.namespace) {
                    def manifest = file("${project.projectDir}/src/main/AndroidManifest.xml")
                    if (manifest.exists()) {
                        def pkg = new XmlSlurper(false, false).parse(manifest).'@package'.text()
                        if (pkg) {
                            project.android.namespace = pkg
                        }
                    }
                }
                if (isAndroidLib && project.android.hasProperty('buildFeatures')) {
                    project.android.buildFeatures.buildConfig = true
                }
            } catch (ignored) {
                // ignore
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
